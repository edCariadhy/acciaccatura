  <rect width="160" height="160" rx="28" fill="#1f242c" stroke="#38414e" stroke-width="2"/>

  <path d="M 38 65 L 22 80 L 38 95" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 122 65 L 138 80 L 122 95" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

