  <rect x="74" y="38" width="6.5" height="76" rx="3.25" fill="url(#accentGrad)"/>

  <path d="M 80.5 40 C 95 44, 108 56, 106 72 C 104 80, 94 82, 80.5 80" fill="none" stroke="url(#accentGrad)" stroke-width="6.5" stroke-linecap="round"/>

